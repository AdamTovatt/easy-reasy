name: Publish NuGet

on:
  push:
    tags:
      - '*-v*'

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x

    - name: Parse tag
      id: tag
      run: |
        TAG="${GITHUB_REF_NAME}"
        PACKAGE="${TAG%-v*}"
        VERSION="${TAG##*-v}"
        echo "PACKAGE=${PACKAGE}" >> $GITHUB_OUTPUT
        echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
        echo "Publishing package '${PACKAGE}' version ${VERSION}"

    - name: Resolve project
      id: project
      run: |
        PACKAGE="${{ steps.tag.outputs.PACKAGE }}"
        # Map tag prefix to project name + matching test project.
        case "$PACKAGE" in
          core)          PROJECT="EasyReasy";                     TEST_PROJECT="EasyReasy.Tests" ;;
          auth)          PROJECT="EasyReasy.Auth";                TEST_PROJECT="EasyReasy.Auth.Tests" ;;
          auth-client)   PROJECT="EasyReasy.Auth.Client";         TEST_PROJECT="EasyReasy.Auth.Client.Tests" ;;
          auth-google)   PROJECT="EasyReasy.Auth.Google";         TEST_PROJECT="EasyReasy.Auth.Google.Tests" ;;
          byteshelf)     PROJECT="EasyReasy.ByteShelfProvider";   TEST_PROJECT="EasyReasy.ByteShelfProvider.Tests" ;;
          env)           PROJECT="EasyReasy.EnvironmentVariables"; TEST_PROJECT="EasyReasy.EnvironmentVariables.Tests" ;;
          vectorstorage) PROJECT="EasyReasy.VectorStorage";       TEST_PROJECT="EasyReasy.VectorStorage.Tests" ;;
          *)             echo "Unknown package: $PACKAGE" && exit 1 ;;
        esac
        echo "PROJECT=${PROJECT}" >> $GITHUB_OUTPUT
        echo "TEST_PROJECT=${TEST_PROJECT}" >> $GITHUB_OUTPUT
        echo "Project: ${PROJECT}"
        echo "Test project: ${TEST_PROJECT}"

    # Each project's csproj <VersionPrefix> is the single source of truth for its
    # version; the tag only selects which package to publish. Fail fast if they
    # disagree so a mistyped tag can never publish an unintended version. The
    # build/pack steps deliberately do NOT pass -p:Version: a global Version
    # property propagates into referenced projects and would stamp cross-package
    # dependencies (e.g. EasyReasy.Auth.Google -> EasyReasy.Auth) at the wrong
    # version, so each project must carry its own version in its csproj.
    - name: Verify tag version matches csproj
      run: |
        PROJECT="${{ steps.project.outputs.PROJECT }}"
        VERSION="${{ steps.tag.outputs.VERSION }}"
        CSPROJ="${PROJECT}/${PROJECT}.csproj"
        CSPROJ_VERSION=$(grep -oP '(?<=<VersionPrefix>)[^<]+' "$CSPROJ" || true)
        if [ -z "$CSPROJ_VERSION" ]; then
          echo "::error::No <VersionPrefix> found in ${CSPROJ}; add one so the published version is explicit and verifiable."
          exit 1
        fi
        if [ "$CSPROJ_VERSION" != "$VERSION" ]; then
          echo "::error::Tag version ${VERSION} does not match ${CSPROJ} <VersionPrefix> ${CSPROJ_VERSION}. Bump the csproj or fix the tag."
          exit 1
        fi
        echo "Version check OK: ${PROJECT} ${VERSION}"

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore --configuration Release

    # Only run the test project matching the package being published, and skip:
    # - IntegrationTests: require external services (real ByteShelf backend,
    #   remote auth server) or are placeholders not meant for CI.
    # - PerformanceTest: memory/timing assertions that are unreliable on
    #   shared CI runners.
    - name: Test
      run: dotnet test ${{ steps.project.outputs.TEST_PROJECT }} --no-build --configuration Release --filter "FullyQualifiedName!~IntegrationTests&FullyQualifiedName!~PerformanceTest"

    - name: Pack
      run: dotnet pack ${{ steps.project.outputs.PROJECT }} --no-build --configuration Release --output ./nupkgs

    - name: Publish to NuGet
      run: dotnet nuget push ./nupkgs/*.nupkg --source https://api.nuget.org/v3/index.json --api-key ${{ secrets.NUGET_API_KEY }} --skip-duplicate
